<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes — Reasoning Hub</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="stylesheet" href="/css/theme.css">
<script>(function(){try{var t=localStorage.getItem('rh_theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<style>
  .notes-layout{ display:grid; grid-template-columns:280px 1fr; gap:20px; margin-top:20px; align-items:start; }
  @media (max-width:820px){ .notes-layout{ grid-template-columns:1fr; } }
  .tabs{ display:flex; gap:6px; margin-bottom:14px; }
  .tab-btn{ background:transparent; border:1.5px solid var(--line); border-radius:8px; padding:7px 14px; font-family:'Inter',sans-serif; font-size:13px; cursor:pointer; color:var(--ink); }
  .tab-btn.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .note-item{ display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-radius:8px; cursor:pointer; font-size:13.5px; margin-bottom:4px; border:1.5px solid transparent; }
  .note-item:hover{ background:var(--hover-bg); }
  .note-item.active{ background:var(--active-bg); border-color:var(--blue); font-weight:600; }
  .note-tag{ font-family:'JetBrains Mono',monospace; font-size:10px; padding:2px 6px; border-radius:5px; background:var(--blue-soft); color:var(--blue); margin-left:6px; }
  .note-body{ white-space:pre-wrap; line-height:1.7; font-size:14.5px; color:var(--ink); }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
  .field input, .field textarea, .field select{ width:100%; padding:9px 11px; border:1.5px solid var(--line); border-radius:8px; font-family:'Inter',sans-serif; font-size:13.5px; color:var(--ink); background:var(--paper); }
  .field textarea{ min-height:180px; resize:vertical; font-family:'Inter',sans-serif; }
  .btn{ background:var(--ink); color:#fff; border:none; border-radius:8px; padding:9px 18px; font-family:'Inter',sans-serif; font-weight:600; font-size:13px; cursor:pointer; }
  .btn.secondary{ background:transparent; color:var(--ink); border:1.5px solid var(--line); }
  .btn.danger{ background:transparent; color:var(--red); border:1.5px solid var(--red); }
  .vis-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  .vis-row .field{ flex:1; min-width:140px; }
  .msg{ font-size:13px; margin-top:8px; display:none; }
  .msg.ok{ color:var(--green); display:block; }
  .msg.err{ color:var(--red); display:block; }
  .empty-state{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--muted); padding:20px 0; text-align:center; }

  /* "Books" strip at the top of Browse — every added book/exercise set
     shows up as a small card with its cover photo and name. */
  .book-cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:14px; margin-bottom:18px; }
  .book-card{
    display:block; text-decoration:none; color:inherit; border:1.5px solid var(--line); border-radius:10px;
    overflow:hidden; background:var(--panel); transition:border-color .12s ease, transform .12s ease;
  }
  .book-card:hover{ border-color:var(--blue); transform:translateY(-2px); }
  .book-card .cover-wrap{
    width:100%; aspect-ratio:3/4; background:var(--paper); display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .book-card .cover-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
  .book-card .cover-wrap .no-cover{ font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--muted); text-align:center; padding:0 8px; }
  .book-card .book-card-name{ padding:8px 10px; font-size:12.5px; font-weight:600; line-height:1.3; }
</style>
</head>
<body class="hub-body">
<div id="siteNav"></div>

<div class="hub-wrap">
  <div class="hub-eyebrow">Study material</div>
  <h1 class="hub-h1">Notes</h1>
  <p class="hub-sub">Book-style notes written by facilitators — some public, some limited to a team, some by request.</p>

  <div class="tabs">
    <button class="tab-btn active" data-tab="browse" id="tabBrowse">Browse</button>
    <button class="tab-btn" data-tab="manage" id="tabManage" style="display:none;">Write / manage</button>
  </div>

  <div id="browsePane">
    <div class="hub-card" style="margin-bottom:18px;">
      <div style="font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:10px;">Books &amp; exercises</div>
      <div id="bookCards" class="book-cards"><div class="empty-state">Loading…</div></div>
    </div>
    <div class="notes-layout">
      <div>
        <div class="hub-card">
          <div style="font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:8px;">Notes you can read</div>
          <div id="noteList"><div class="empty-state">Loading…</div></div>
        </div>
      </div>
      <div id="noteDetail"><div class="hub-card empty-state">Select a note to read it.</div></div>
    </div>
  </div>

  <div id="managePane" style="display:none;">
    <div class="notes-layout">
      <div>
        <div class="hub-card">
          <div style="font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:8px;">All notes</div>
          <div id="manageList"><div class="empty-state">Loading…</div></div>
          <button class="btn secondary" id="newNoteBtn" style="width:100%; margin-top:10px;">+ New note</button>
        </div>
        <div class="hub-card" style="margin-top:16px;">
          <div style="font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:8px;">Access requests</div>
          <div id="requestList"><div class="empty-state">None pending.</div></div>
        </div>
      </div>
      <div id="editDetail"><div class="hub-card empty-state">Select or create a note to edit it.</div></div>
    </div>
  </div>
</div>

<script src="/js/nav.js"></script>
<script src="/js/toast.js"></script>
<script src="/js/file-input-enhance.js"></script>
<script>
function getToken(){ return localStorage.getItem('rh_token'); }
function authHeaders(extra){ return Object.assign({ Authorization: 'Bearer ' + getToken() }, extra || {}); }
function esc(s){ if(s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let me = null;
let browseNotes = [];
let manageNotes = [];
let teams = [];
let activeReadId = null;
let activeEditId = null;

function isManager(){ return me && (me.role === 'admin' || me.role === 'facilitator'); }

/* ---------------- browse (read) ---------------- */

// Cover routes redirect to a signed Storage URL and need the Authorization
// header, which <img src="..."> can never send on its own — fetch with the
// header and turn the result into a blob URL instead (same pattern used on
// Exercises and Content).
async function fetchAuthedBlob(url){
  const res = await fetch(url, { headers: authHeaders() });
  if(!res.ok) throw new Error('not ok');
  return res.blob();
}

async function loadBookCards(){
  const mount = document.getElementById('bookCards');
  try{
    const res = await fetch('/api/content/books', { headers: authHeaders() });
    const data = await res.json();
    const books = data.books || [];
    if(!books.length){ mount.innerHTML = '<div class="empty-state">No books added yet.</div>'; return; }
    mount.innerHTML = books.map(b => `
      <a class="book-card" href="/exercises.html?book=${b.id}" data-book-id="${b.id}">
        <div class="cover-wrap" id="cover-${b.id}"><span class="no-cover">No cover</span></div>
        <div class="book-card-name">${esc(b.title)}</div>
      </a>
    `).join('');
    books.forEach(b => {
      if(!b.cover_storage_path) return;
      fetchAuthedBlob('/api/content/books/' + b.id + '/cover').then(blob => {
        const wrap = document.getElementById('cover-' + b.id);
        if(!wrap) return;
        wrap.innerHTML = `<img src="${URL.createObjectURL(blob)}" alt="${esc(b.title)} cover">`;
      }).catch(() => {});
    });
  }catch(e){ mount.innerHTML = '<div class="empty-state">Could not load books.</div>'; }
}

async function loadBrowseNotes(){
  const res = await fetch('/api/notes', { headers: authHeaders() });
  const data = await res.json();
  browseNotes = data.notes || [];
  renderNoteList();
}

function visLabel(n){
  if(n.team_id) return 'team';
  if(!n.is_public) return 'private';
  return n.access_mode === 'restricted' ? 'reader' : 'public';
}

function renderNoteList(){
  const list = document.getElementById('noteList');
  if(!browseNotes.length){ list.innerHTML = '<div class="empty-state">No notes available to you yet.</div>'; return; }
  list.innerHTML = browseNotes.map(n => `
    <div class="note-item ${String(n.id)===String(activeReadId)?'active':''}" data-id="${n.id}">
      <span>${esc(n.title)}<span class="note-tag">${visLabel(n)}</span></span>
    </div>
  `).join('');
  list.querySelectorAll('.note-item').forEach(el => {
    el.addEventListener('click', () => { activeReadId = el.dataset.id; renderNoteList(); openNote(el.dataset.id); });
  });
}

async function openNote(id){
  const mount = document.getElementById('noteDetail');
  const meta = browseNotes.find(n => String(n.id) === String(id));
  const res = await fetch('/api/notes/' + id, { headers: authHeaders() });
  const data = await res.json();
  if(!res.ok){
    const needsRequest = meta && meta.is_public && meta.access_mode === 'restricted';
    mount.innerHTML = `<div class="hub-card">
      <div style="font-weight:600; margin-bottom:8px;">${esc(meta ? meta.title : 'Note')}</div>
      <div class="msg err" style="display:block;">${esc(data.error || 'Cannot open this note.')}</div>
      ${needsRequest && meta.my_request_status !== 'pending' && meta.my_request_status !== 'approved' ? '<button class="btn" id="reqBtn" style="margin-top:8px;">Request access</button>' : ''}
      ${meta && meta.my_request_status === 'pending' ? '<div class="msg" style="display:block; color:var(--muted);">Request pending.</div>' : ''}
    </div>`;
    const reqBtn = document.getElementById('reqBtn');
    if(reqBtn) reqBtn.addEventListener('click', async () => {
      const r = await fetch('/api/notes/' + id + '/request-access', { method:'POST', headers: authHeaders() });
      const d = await r.json();
      if(!r.ok){ showToast(d.error || 'Could not send request', 'error'); return; }
      showToast('Request sent.', 'success');
      loadBrowseNotes();
    });
    return;
  }
  mount.innerHTML = `<div class="hub-card">
    <div style="font-family:'Newsreader',serif; font-style:italic; font-weight:600; font-size:20px; color:var(--ink); margin-bottom:14px;">${esc(data.note.title)}</div>
    <div id="readCoverMount"></div>
    <div class="note-body">${esc(data.note.body)}</div>
    <div id="readDocMount" style="margin-top:14px;"></div>
  </div>`;
  if(data.note.cover_storage_path){
    fetchAuthedBlob('/api/notes/' + id + '/cover').then(blob => {
      const mount2 = document.getElementById('readCoverMount');
      if(mount2) mount2.innerHTML = `<img src="${URL.createObjectURL(blob)}" alt="${esc(data.note.title)}" style="max-width:220px; width:100%; border-radius:8px; border:1.5px solid var(--line); margin-bottom:14px; display:block;">`;
    }).catch(() => {});
  }
  if(data.note.document_original_name){
    const docMount = document.getElementById('readDocMount');
    const link = document.createElement('a');
    link.href = '#';
    link.className = 'btn secondary';
    link.style.cssText = 'display:inline-block; padding:6px 14px; font-size:12.5px;';
    link.textContent = '📄 Open ' + data.note.document_original_name;
    link.addEventListener('click', async (e) => {
      e.preventDefault();
      try{
        const blob = await fetchAuthedBlob('/api/notes/' + id + '/document');
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank', 'noopener');
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      }catch(err){ showToast(err.message || 'Could not open document.', 'error'); }
    });
    docMount.appendChild(link);
  }
}

/* ---------------- manage (facilitator/admin) ---------------- */

async function loadTeams(){
  const res = await fetch('/api/teams/mine', { headers: authHeaders() });
  if(!res.ok) return;
  const data = await res.json();
  teams = (data.teams || []).filter(t => t.my_status === 'accepted');
}

async function loadManageNotes(){
  const res = await fetch('/api/notes', { headers: authHeaders() });
  const data = await res.json();
  manageNotes = data.notes || [];
  renderManageList();
}

function renderManageList(){
  const list = document.getElementById('manageList');
  if(!manageNotes.length){ list.innerHTML = '<div class="empty-state">No notes yet.</div>'; return; }
  list.innerHTML = manageNotes.map(n => `
    <div class="note-item ${String(n.id)===String(activeEditId)?'active':''}" data-id="${n.id}">
      <span>${esc(n.title)}<span class="note-tag">${visLabel(n)}</span></span>
      <button data-delete="${n.id}" title="Delete" style="background:none;border:none;color:var(--red);cursor:pointer;">✕</button>
    </div>
  `).join('');
  list.querySelectorAll('.note-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if(e.target.closest('button[data-delete]')) return;
      activeEditId = el.dataset.id; renderManageList(); renderEditor(el.dataset.id);
    });
  });
  list.querySelectorAll('button[data-delete]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(!confirm('Delete this note? This cannot be undone.')) return;
      const res = await fetch('/api/notes/' + btn.dataset.delete, { method:'DELETE', headers: authHeaders() });
      if(!res.ok){ const d = await res.json(); showToast(d.error || 'Could not delete', 'error'); return; }
      if(String(activeEditId) === btn.dataset.delete) activeEditId = null;
      loadManageNotes();
      document.getElementById('editDetail').innerHTML = '<div class="hub-card empty-state">Select or create a note to edit it.</div>';
    });
  });
}

function teamOptions(selectedId){
  return '<option value="">No team</option>' + teams.map(t => `<option value="${t.id}" ${String(t.id)===String(selectedId)?'selected':''}>${esc(t.name)}</option>`).join('');
}

// Wires the photo/document upload card in the editor. Mirrors the
// cover/document controls in content.html's book editor.
function setupNoteMediaControls(note){
  const coverImg = document.getElementById('noteCoverPreviewImg');
  const coverEmpty = document.getElementById('noteCoverPreviewEmpty');
  const coverMsg = document.getElementById('noteCoverMsg');
  const docCurrent = document.getElementById('noteDocCurrent');
  const docMsg = document.getElementById('noteDocMsg');

  if(note.cover_storage_path){
    fetchAuthedBlob('/api/notes/' + note.id + '/cover').then(blob => {
      coverImg.src = URL.createObjectURL(blob);
      coverImg.style.display = 'block';
      coverEmpty.style.display = 'none';
    }).catch(() => {});
  }
  if(note.document_original_name){
    docCurrent.innerHTML = '';
    const link = document.createElement('a');
    link.href = '#';
    link.className = 'btn secondary';
    link.style.cssText = 'display:inline-block; padding:5px 10px; font-size:12.5px;';
    link.textContent = '📄 Open ' + note.document_original_name;
    link.addEventListener('click', async (e) => {
      e.preventDefault();
      try{
        const blob = await fetchAuthedBlob('/api/notes/' + note.id + '/document');
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank', 'noopener');
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      }catch(err){ showToast(err.message || 'Could not open document.', 'error'); }
    });
    docCurrent.appendChild(link);
  } else {
    docCurrent.textContent = 'No document attached.';
  }

  document.getElementById('uploadNoteCoverBtn').addEventListener('click', async () => {
    const input = document.getElementById('noteCoverFileInput');
    if(!input.files.length){ coverMsg.textContent = 'Choose an image first.'; coverMsg.className = 'msg err'; return; }
    const fd = new FormData();
    fd.append('cover', input.files[0]);
    const res = await fetch('/api/notes/' + note.id + '/cover', { method: 'POST', headers: { Authorization: 'Bearer ' + getToken() }, body: fd });
    const data = await res.json();
    coverMsg.textContent = res.ok ? 'Photo updated.' : (data.error || 'Could not upload photo');
    coverMsg.className = 'msg ' + (res.ok ? 'ok' : 'err');
    if(res.ok){ await loadManageNotes(); renderEditor(note.id); }
  });

  document.getElementById('removeNoteCoverBtn').addEventListener('click', async () => {
    if(!note.cover_storage_path) return;
    if(!confirm('Remove this photo?')) return;
    const res = await fetch('/api/notes/' + note.id + '/cover', { method: 'DELETE', headers: authHeaders() });
    const data = await res.json();
    if(!res.ok){ showToast(data.error || 'Could not remove photo', 'error'); return; }
    await loadManageNotes(); renderEditor(note.id);
  });

  document.getElementById('uploadNoteDocBtn').addEventListener('click', async () => {
    const input = document.getElementById('noteDocFileInput');
    if(!input.files.length){ docMsg.textContent = 'Choose a file first.'; docMsg.className = 'msg err'; return; }
    const fd = new FormData();
    fd.append('document', input.files[0]);
    const res = await fetch('/api/notes/' + note.id + '/document', { method: 'POST', headers: { Authorization: 'Bearer ' + getToken() }, body: fd });
    const data = await res.json();
    docMsg.textContent = res.ok ? 'Document uploaded.' : (data.error || 'Could not upload document');
    docMsg.className = 'msg ' + (res.ok ? 'ok' : 'err');
    if(res.ok){ await loadManageNotes(); renderEditor(note.id); }
  });

  document.getElementById('removeNoteDocBtn').addEventListener('click', async () => {
    if(!note.document_storage_path) return;
    if(!confirm('Remove the attached document?')) return;
    const res = await fetch('/api/notes/' + note.id + '/document', { method: 'DELETE', headers: authHeaders() });
    const data = await res.json();
    if(!res.ok){ showToast(data.error || 'Could not remove document', 'error'); return; }
    await loadManageNotes(); renderEditor(note.id);
  });
}

function renderEditor(id, draft){
  const mount = document.getElementById('editDetail');
  const note = id ? manageNotes.find(n => String(n.id) === String(id)) : null;
  const isNew = !id;
  mount.innerHTML = `
    <div class="hub-card">
      <div class="field"><label>Title</label><input type="text" id="noteTitle" maxlength="200" value="${esc(draft ? draft.title : (note ? note.title : ''))}"></div>
      <div class="field">
        <label>Body</label>
        <textarea id="noteBody">${esc(draft ? draft.body : '')}</textarea>
      </div>
      <div class="field">
        <label>Draft with AI (Study Helper writes a first pass — review before saving)</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="aiTopic" placeholder="e.g. Faraday's law of induction">
          <button class="btn secondary" id="aiDraftBtn" style="white-space:nowrap;">✨ Draft</button>
        </div>
      </div>
      <div class="vis-row">
        <div class="field">
          <label>Visibility</label>
          <select id="visSelect">
            <option value="private" ${(!note || !note.is_public) ? 'selected' : ''}>Private (only you/admins)</option>
            <option value="reader" ${(note && note.is_public && note.access_mode==='restricted') ? 'selected' : ''}>Reader (public listing, request required)</option>
            <option value="public" ${(note && note.is_public && note.access_mode==='open') ? 'selected' : ''}>Public (anyone signed in)</option>
          </select>
        </div>
        <div class="field">
          <label>Team (optional, overrides above)</label>
          <select id="teamSelect">${teamOptions(note ? note.team_id : '')}</select>
        </div>
      </div>
      <button class="btn" id="saveNoteBtn">${isNew ? 'Create note' : 'Save changes'}</button>
      <div class="msg" id="noteMsg"></div>
    </div>

    ${!isNew ? `
    <div class="hub-card" style="margin-top:16px;">
      <div style="font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:10px;">Photo &amp; document</div>
      <div style="display:flex; gap:18px; flex-wrap:wrap;">
        <div>
          <div id="noteCoverPreviewWrap" style="width:110px; height:110px; border-radius:8px; overflow:hidden; border:1.5px solid var(--line); background:var(--paper); display:flex; align-items:center; justify-content:center;">
            <img id="noteCoverPreviewImg" style="display:none; width:100%; height:100%; object-fit:cover;" alt="Note photo">
            <span id="noteCoverPreviewEmpty" class="mono" style="font-size:10.5px; color:var(--muted); text-align:center; padding:0 8px;">No photo yet</span>
          </div>
          <input type="file" id="noteCoverFileInput" accept="image/*" style="margin-top:8px;">
          <div style="display:flex; gap:6px; margin-top:6px;">
            <button class="btn secondary" id="uploadNoteCoverBtn" style="font-size:12px; padding:5px 10px;">Upload</button>
            <button class="btn danger" id="removeNoteCoverBtn" style="font-size:12px; padding:5px 10px;">Remove</button>
          </div>
          <div class="msg" id="noteCoverMsg"></div>
        </div>
        <div style="flex:1; min-width:220px;">
          <div style="font-size:12px; color:var(--muted); margin-bottom:4px;">Document</div>
          <div id="noteDocCurrent" class="mono" style="font-size:12.5px; color:var(--ink); margin-bottom:8px;">No document attached.</div>
          <input type="file" id="noteDocFileInput" accept=".pdf,.doc,.docx,.odt,.txt,.md,.csv,.rtf">
          <div style="display:flex; gap:6px; margin-top:6px;">
            <button class="btn secondary" id="uploadNoteDocBtn" style="font-size:12px; padding:5px 10px;">Upload</button>
            <button class="btn danger" id="removeNoteDocBtn" style="font-size:12px; padding:5px 10px;">Remove</button>
          </div>
          <div class="msg" id="noteDocMsg"></div>
        </div>
      </div>
    </div>` : ''}
  `;
  if (window.rhEnhanceFileInputs) window.rhEnhanceFileInputs();
  if (!isNew) setupNoteMediaControls(note);

  document.getElementById('aiDraftBtn').addEventListener('click', async () => {
    const topic = document.getElementById('aiTopic').value.trim();
    if(!topic) return;
    const btn = document.getElementById('aiDraftBtn');
    btn.disabled = true; btn.textContent = 'Drafting…';
    try {
      const res = await fetch('/api/assistant/draft-note', {
        method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ topic })
      });
      const data = await res.json();
      if(!res.ok){ showToast(data.error || 'Could not draft note', 'error'); return; }
      if(!document.getElementById('noteTitle').value.trim()) document.getElementById('noteTitle').value = data.title;
      document.getElementById('noteBody').value = data.body;
    } finally {
      btn.disabled = false; btn.textContent = '✨ Draft';
    }
  });

  document.getElementById('saveNoteBtn').addEventListener('click', async () => {
    const msg = document.getElementById('noteMsg');
    const title = document.getElementById('noteTitle').value.trim();
    const body = document.getElementById('noteBody').value.trim();
    const vis = document.getElementById('visSelect').value;
    const teamId = document.getElementById('teamSelect').value || null;
    if(!title || !body){ msg.textContent = 'Title and body are required.'; msg.className = 'msg err'; return; }
    const payload = {
      title, body,
      isPublic: vis !== 'private', accessMode: vis === 'reader' ? 'restricted' : 'open',
      teamId
    };
    const url = isNew ? '/api/notes' : '/api/notes/' + id;
    const res = await fetch(url, {
      method: isNew ? 'POST' : 'PATCH', headers: authHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(!res.ok){ msg.textContent = data.error; msg.className = 'msg err'; return; }
    msg.textContent = 'Saved.'; msg.className = 'msg ok';
    activeEditId = isNew ? data.note.id : id;
    await loadManageNotes();
    renderEditor(activeEditId);
  });
}

document.getElementById('newNoteBtn').addEventListener('click', () => {
  activeEditId = null; renderManageList(); renderEditor(null);
});

async function loadRequests(){
  const list = document.getElementById('requestList');
  const res = await fetch('/api/notes/access-requests/incoming', { headers: authHeaders() });
  if(!res.ok) return;
  const data = await res.json();
  const pending = (data.requests || []).filter(r => r.status === 'pending');
  if(!pending.length){ list.innerHTML = '<div class="empty-state">None pending.</div>'; return; }
  list.innerHTML = pending.map(r => `
    <div style="padding:8px 0; border-bottom:1px solid var(--grid); font-size:13px;">
      <div>${esc(r.requester_name || r.requester_email)} → <em>${esc(r.note_title)}</em></div>
      <div style="margin-top:6px; display:flex; gap:8px;">
        <button class="btn secondary" data-approve="${r.id}" style="padding:4px 10px; font-size:12px;">Approve</button>
        <button class="btn danger" data-deny="${r.id}" style="padding:4px 10px; font-size:12px;">Deny</button>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('[data-approve]').forEach(b => b.addEventListener('click', () => decide(b.dataset.approve, true)));
  list.querySelectorAll('[data-deny]').forEach(b => b.addEventListener('click', () => decide(b.dataset.deny, false)));
}

async function decide(id, approve){
  await fetch('/api/notes/access-requests/' + id + '/decide', {
    method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify({ approve })
  });
  loadRequests();
}

/* ---------------- tabs ---------------- */

document.getElementById('tabBrowse').addEventListener('click', () => {
  document.getElementById('tabBrowse').classList.add('active');
  document.getElementById('tabManage').classList.remove('active');
  document.getElementById('browsePane').style.display = '';
  document.getElementById('managePane').style.display = 'none';
});
document.getElementById('tabManage').addEventListener('click', () => {
  document.getElementById('tabManage').classList.add('active');
  document.getElementById('tabBrowse').classList.remove('active');
  document.getElementById('managePane').style.display = '';
  document.getElementById('browsePane').style.display = 'none';
});

(async function init(){
  me = await window.HubNav.init('notes', true);
  if(!me) return;
  await loadBookCards();
  await loadBrowseNotes();
  if(isManager()){
    document.getElementById('tabManage').style.display = '';
    await loadTeams();
    await loadManageNotes();
    await loadRequests();
  }
  const wantedNoteId = new URLSearchParams(location.search).get('note');
  if(wantedNoteId && browseNotes.some(n => String(n.id) === String(wantedNoteId))){
    activeReadId = wantedNoteId;
    renderNoteList();
    openNote(wantedNoteId);
  }
})();
</script>
