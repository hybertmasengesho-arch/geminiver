<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content — Reasoning Hub</title>
<link rel="stylesheet" href="/css/theme.css">
<script>(function(){try{var t=localStorage.getItem('rh_theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<style>
  .content-layout{ display:grid; grid-template-columns:260px 1fr; gap:20px; margin-top:20px; align-items:start; }
  @media (max-width:820px){ .content-layout{ grid-template-columns:1fr; } }
  .book-item{
    display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-radius:8px;
    cursor:pointer; font-size:13.5px; margin-bottom:4px; border:1.5px solid transparent;
  }
  .book-item:hover{ background:var(--hover-bg); }
  .book-item.active{ background:var(--active-bg); border-color:var(--blue); font-weight:600; }
  .book-item button{ background:none; border:none; color:var(--red); cursor:pointer; font-size:12px; opacity:.7; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
  .field input, .field textarea, .field select{
    width:100%; padding:9px 11px; border:1.5px solid var(--line); border-radius:8px;
    font-family:'Inter',sans-serif; font-size:13.5px; color:var(--ink); background:var(--paper);
  }
  .field textarea{ min-height:60px; resize:vertical; }
  .btn{
    background:var(--ink); color:#fff; border:none; border-radius:8px; padding:9px 18px;
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px; cursor:pointer;
  }
  .btn.secondary{ background:transparent; color:var(--ink); border:1.5px solid var(--line); }
  .btn.danger{ background:transparent; color:var(--red); border:1.5px solid var(--red); }
  .opt-row{ display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  .opt-row input[type="text"]{ flex:1; }
  .opt-row input[type="radio"]{ flex:none; width:18px; height:18px; }
  .opt-row button{ background:none; border:none; color:var(--red); cursor:pointer; font-size:14px; flex:none; }
  .q-item{ border:1.5px solid var(--grid); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .q-item-text{ font-size:13.5px; color:var(--ink); font-weight:600; margin-bottom:4px; }
  .q-item-meta{ font-size:11.5px; color:var(--muted); }
  .q-item-actions{ margin-top:8px; display:flex; gap:8px; }
  .q-item-actions button{ font-size:12px; padding:5px 12px; }
  .swatch{ display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:middle; margin-left:6px; border:1px solid var(--line); }
  .empty-state{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--muted); padding:20px 0; text-align:center; }
  .msg{ font-size:13px; margin-top:8px; display:none; }
  .msg.ok{ color:var(--green); display:block; }
  .msg.err{ color:var(--red); display:block; }
</style>
</head>
<body class="hub-body">
<div id="siteNav"></div>

<div class="hub-wrap">
  <div class="hub-eyebrow">Facilitator tools</div>
  <h1 class="hub-h1">Content</h1>
  <p class="hub-sub">Create books and their practice questions — mark the correct answer, pick a highlight color, and attach a reference.</p>

  <div id="notAllowed" style="display:none;" class="hub-card">You need facilitator or admin access to see this page.</div>

  <div id="contentApp" style="display:none;">
    <div class="content-layout">
      <div>
        <div class="hub-card">
          <div style="font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:8px;">Books</div>
          <div id="bookList"><div class="empty-state">Loading…</div></div>
          <div class="field" style="margin-top:14px;">
            <label>New book title</label>
            <input type="text" id="newBookTitle" maxlength="200" placeholder="e.g. Circuits Fundamentals">
          </div>
          <button class="btn" id="createBookBtn" style="width:100%;">Create book</button>
          <div class="msg" id="bookMsg"></div>
        </div>
      </div>

      <div id="bookDetail">
        <div class="hub-card empty-state">Select or create a book to manage its questions.</div>
      </div>
    </div>
  </div>
</div>

<script src="/js/nav.js"></script>
<script>
function getToken(){ return localStorage.getItem('rh_token'); }
function authHeaders(extra){ return Object.assign({ Authorization: 'Bearer ' + getToken() }, extra || {}); }
function esc(s){
  if(s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let books = [];
let activeBookId = null;
let optRowSeq = 0;

async function loadBooks(){
  const res = await fetch('/api/content/books', { headers: authHeaders() });
  const data = await res.json();
  books = data.books || [];
  renderBookList();
}

function renderBookList(){
  const list = document.getElementById('bookList');
  if(!books.length){ list.innerHTML = '<div class="empty-state">No books yet.</div>'; return; }
  list.innerHTML = books.map(b => `
    <div class="book-item ${String(b.id) === String(activeBookId) ? 'active' : ''}" data-id="${b.id}">
      <span>${esc(b.title)}</span>
      <button data-delete="${b.id}" title="Delete book">✕</button>
    </div>
  `).join('');
  list.querySelectorAll('.book-item').forEach(el => {
    el.addEventListener('click', (e) => {
      if(e.target.closest('button[data-delete]')) return;
      activeBookId = el.dataset.id;
      renderBookList();
      renderBookDetail();
    });
  });
  list.querySelectorAll('button[data-delete]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(!confirm('Delete this book and ALL its questions? This cannot be undone.')) return;
      const res = await fetch('/api/content/books/' + btn.dataset.delete, { method: 'DELETE', headers: authHeaders() });
      if(!res.ok){ const d = await res.json(); alert(d.error || 'Could not delete (admin access required to delete books).'); return; }
      if(String(activeBookId) === btn.dataset.delete) activeBookId = null;
      loadBooks();
      document.getElementById('bookDetail').innerHTML = '<div class="hub-card empty-state">Select or create a book to manage its questions.</div>';
    });
  });
}

document.getElementById('createBookBtn').addEventListener('click', async () => {
  const input = document.getElementById('newBookTitle');
  const msg = document.getElementById('bookMsg');
  const title = input.value.trim();
  if(!title) return;
  const res = await fetch('/api/content/books', {
    method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({ title })
  });
  const data = await res.json();
  if(!res.ok){ msg.textContent = data.error; msg.className = 'msg err'; return; }
  msg.textContent = 'Created.'; msg.className = 'msg ok';
  input.value = '';
  activeBookId = data.book.id;
  await loadBooks();
  renderBookDetail();
});

function newOptionRow(id, text, isCorrect, groupName){
  const row = document.createElement('div');
  row.className = 'opt-row';
  row.dataset.optId = id;
  row.innerHTML = `
    <input type="radio" name="${groupName}" ${isCorrect ? 'checked' : ''}>
    <input type="text" placeholder="Option text" value="${esc(text || '')}">
    <button type="button" title="Remove option">✕</button>
  `;
  row.querySelector('button').addEventListener('click', () => row.remove());
  return row;
}

async function renderBookDetail(){
  const book = books.find(b => String(b.id) === String(activeBookId));
  const mount = document.getElementById('bookDetail');
  if(!book){ mount.innerHTML = '<div class="hub-card empty-state">Select or create a book to manage its questions.</div>'; return; }

  mount.innerHTML = `
    <div class="hub-card" style="margin-bottom:16px;">
      <div style="font-family:'Newsreader',serif; font-style:italic; font-weight:600; font-size:19px; color:var(--ink); margin-bottom:10px;">${esc(book.title)}</div>
      <div class="field"><label>Author</label><input type="text" id="bookAuthor" value="${esc(book.author || '')}"></div>
      <div class="field"><label>Description</label><textarea id="bookDescription">${esc(book.description || '')}</textarea></div>
      <button class="btn secondary" id="saveBookBtn">Save book details</button>
      <div class="msg" id="saveBookMsg"></div>
    </div>

    <div class="hub-card" style="margin-bottom:16px;">
      <div style="font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:10px;">Add a question</div>
      <div class="field"><label>Question text</label><textarea id="qText" placeholder="What is..."></textarea></div>
      <div class="field">
        <label>Options — select the radio next to the correct one</label>
        <div id="optRows"></div>
        <button type="button" class="btn secondary" id="addOptBtn" style="margin-top:4px;">+ Add option</button>
      </div>
      <div class="field"><label>Explanation (shown after checking)</label><textarea id="qExplanation" placeholder="Why the correct answer is correct…"></textarea></div>
      <div class="field"><label>Reference URL (optional)</label><input type="text" id="qReference" placeholder="https://…"></div>
      <div class="field" style="max-width:140px;"><label>Highlight color</label><input type="color" id="qColor" value="#2F6F4F" style="height:38px; padding:2px;"></div>
      <button class="btn" id="addQuestionBtn">Add question</button>
      <div class="msg" id="qMsg"></div>
    </div>

    <div style="font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:8px;">Questions in this book</div>
    <div id="qList"><div class="empty-state">Loading…</div></div>
  `;

  const optRows = document.getElementById('optRows');
  optRowSeq = 0;
  optRows.appendChild(newOptionRow('opt' + (++optRowSeq), '', true, 'newQCorrect'));
  optRows.appendChild(newOptionRow('opt' + (++optRowSeq), '', false, 'newQCorrect'));
  document.getElementById('addOptBtn').addEventListener('click', () => {
    optRows.appendChild(newOptionRow('opt' + (++optRowSeq), '', false, 'newQCorrect'));
  });

  document.getElementById('saveBookBtn').addEventListener('click', async () => {
    const msg = document.getElementById('saveBookMsg');
    const res = await fetch('/api/content/books/' + book.id, {
      method: 'PATCH', headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ author: document.getElementById('bookAuthor').value, description: document.getElementById('bookDescription').value })
    });
    const data = await res.json();
    msg.textContent = res.ok ? 'Saved.' : (data.error || 'Could not save');
    msg.className = 'msg ' + (res.ok ? 'ok' : 'err');
    loadBooks();
  });

  document.getElementById('addQuestionBtn').addEventListener('click', async () => {
    const msg = document.getElementById('qMsg');
    const rows = Array.from(optRows.querySelectorAll('.opt-row'));
    const options = rows.map(r => ({ id: r.dataset.optId, text: r.querySelector('input[type="text"]').value.trim() })).filter(o => o.text);
    const correctRow = rows.find(r => r.querySelector('input[type="radio"]').checked);
    if(!options.length || options.length < 2){ msg.textContent = 'Add at least 2 options.'; msg.className = 'msg err'; return; }
    if(!correctRow || !correctRow.querySelector('input[type="text"]').value.trim()){ msg.textContent = 'Mark which option is correct.'; msg.className = 'msg err'; return; }

    const res = await fetch('/api/content/questions', {
      method: 'POST', headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({
        bookId: book.id,
        questionText: document.getElementById('qText').value,
        options,
        correctOptionId: correctRow.dataset.optId,
        explanation: document.getElementById('qExplanation').value,
        reference: document.getElementById('qReference').value,
        color: document.getElementById('qColor').value
      })
    });
    const data = await res.json();
    if(!res.ok){ msg.textContent = data.error; msg.className = 'msg err'; return; }
    msg.textContent = 'Question added.'; msg.className = 'msg ok';
    document.getElementById('qText').value = '';
    document.getElementById('qExplanation').value = '';
    document.getElementById('qReference').value = '';
    loadQuestions(book.id);
  });

  loadQuestions(book.id);
}

async function loadQuestions(bookId){
  const list = document.getElementById('qList');
  const res = await fetch('/api/content/books/' + bookId + '/questions', { headers: authHeaders() });
  const data = await res.json();
  const questions = data.questions || [];
  if(!questions.length){ list.innerHTML = '<div class="hub-card empty-state">No questions yet — add one above.</div>'; return; }
  list.innerHTML = questions.map(q => `
    <div class="q-item" data-id="${q.id}">
      <div class="q-item-text">${esc(q.question_text)}<span class="swatch" style="background:${esc(q.color)};"></span></div>
      <div class="q-item-meta">${q.options.length} options · correct: ${esc((q.options.find(o=>o.id===q.correct_option_id)||{}).text || q.correct_option_id)}${q.reference ? ' · has reference' : ''}</div>
      <div class="q-item-actions">
        <button class="btn secondary" data-action="delete">Delete</button>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('button[data-action="delete"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.closest('.q-item').dataset.id;
      if(!confirm('Delete this question?')) return;
      await fetch('/api/content/questions/' + id, { method: 'DELETE', headers: authHeaders() });
      loadQuestions(bookId);
    });
  });
}

(async function init(){
  const user = await window.HubNav.init('content', true);
  if(!user) return;
  if(user.role !== 'admin' && user.role !== 'facilitator'){
    document.getElementById('notAllowed').style.display = 'block';
    return;
  }
  document.getElementById('contentApp').style.display = 'block';
  loadBooks();
})();
</script>
</body>
</html>
