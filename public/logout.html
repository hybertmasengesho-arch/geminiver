<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  (function(){
    try{
      var saved = localStorage.getItem('rh_theme');
      var theme = saved;
      if(theme !== 'dark' && theme !== 'light'){
        var hour = new Date().getHours();
        theme = (hour >= 6 && hour < 19) ? 'light' : 'dark';
      }
      if(theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    }catch(e){}
  })();
</script>
<title>Signed out — Cortex</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/favicon-180.png">
<style>
  :root{
    --void:#F6F7F5; --panel:#FFFFFF; --panel-2:#EEF2EF; --line:#DCE2DD;
    --phosphor:#0E9E68; --phosphor-dim:#0B7C51;
    --signal:#D6491F; --ink:#12161B; --ink-dim:#5B6470; --scheme:light;
  }
  :root[data-theme="dark"]{
    --void:#07080B; --panel:#0F131A; --panel-2:#151B24; --line:#232B38;
    --phosphor:#4CFFB3; --phosphor-dim:#2B9E77;
    --signal:#FF6B4A; --ink:#EDEFF2; --ink-dim:#8A93A6; --scheme:dark;
  }
  html{ color-scheme:var(--scheme); }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--void); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .grid-field{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:56px 56px; opacity:.25;
    mask-image:radial-gradient(ellipse 60% 55% at 50% 45%, black 25%, transparent 75%);
  }
  .wrap{ position:relative; z-index:1; text-align:center; padding:20px; max-width:420px; }

  svg{ width:150px; height:150px; overflow:visible; }
  .box{ fill:var(--panel-2); stroke:var(--line); stroke-width:1.5; }
  .shackle{
    fill:none; stroke:var(--ink); stroke-width:3.4; stroke-linecap:round;
    transform-origin:75px 58px; transform:rotate(-38deg) translate(-4px,-3px);
    animation:closeShackle 1s cubic-bezier(.34,1.56,.64,1) forwards .5s;
  }
  @keyframes closeShackle{ to{ transform:rotate(0deg) translate(0,0); } }
  .glow{ opacity:0; animation:glowPulse 2.4s ease-in-out infinite 1.3s; }
  @keyframes glowPulse{ 0%,100%{ opacity:.35; } 50%{ opacity:.75; } }
  .keyhole{ fill:var(--void); opacity:0; animation:apIn .4s ease forwards 1.4s; }
  @keyframes apIn{ to{ opacity:1; } }

  /* exit arrow bursting out of the lock once it's closed — signs the
     session out and off the screen */
  .exit-arrow{
    stroke:var(--signal); stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round;
    opacity:0; transform:translate(0,0) scale(.6); transform-origin:75px 58px;
    animation:exitFly 1s cubic-bezier(.3,.6,.3,1) forwards 1.6s;
  }
  @keyframes exitFly{
    0%{ opacity:0; transform:translate(0,0) scale(.5); }
    25%{ opacity:1; transform:translate(4px,-4px) scale(1); }
    100%{ opacity:0; transform:translate(46px,-52px) scale(1.3); }
  }

  /* dispersing particles — the session's data scattering away */
  .particle{ fill:var(--phosphor); opacity:0; }
  .p1{ animation:disperse 1.3s ease-out forwards 1.65s; }
  .p2{ animation:disperse2 1.3s ease-out forwards 1.72s; }
  .p3{ animation:disperse3 1.3s ease-out forwards 1.8s; }
  .p4{ animation:disperse4 1.3s ease-out forwards 1.88s; }
  .p5{ animation:disperse5 1.3s ease-out forwards 1.95s; }
  @keyframes disperse{ 0%{ opacity:0; transform:translate(0,0); } 20%{ opacity:1; } 100%{ opacity:0; transform:translate(-38px,-30px); } }
  @keyframes disperse2{ 0%{ opacity:0; transform:translate(0,0); } 20%{ opacity:1; } 100%{ opacity:0; transform:translate(34px,-10px); } }
  @keyframes disperse3{ 0%{ opacity:0; transform:translate(0,0); } 20%{ opacity:1; } 100%{ opacity:0; transform:translate(-20px,32px); } }
  @keyframes disperse4{ 0%{ opacity:0; transform:translate(0,0); } 20%{ opacity:1; } 100%{ opacity:0; transform:translate(28px,28px); } }
  @keyframes disperse5{ 0%{ opacity:0; transform:translate(0,0); } 20%{ opacity:1; } 100%{ opacity:0; transform:translate(-4px,-40px); } }

  h1{ font-size:26px; margin:26px 0 8px; opacity:0; animation:fadeUp .6s ease forwards 2.1s; }
  .sub{ color:var(--ink-dim); font-size:15px; line-height:1.6; margin:0 0 26px; opacity:0; animation:fadeUp .6s ease forwards 2.25s; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }

  .readout{ font-family:'Courier New',monospace; font-size:12.5px; color:var(--phosphor-dim); margin-bottom:26px; min-height:16px; opacity:0; animation:fadeUp .6s ease forwards 2.4s; }

  .bar{ height:2px; width:100%; background:var(--line); border-radius:2px; overflow:hidden; margin-bottom:26px; opacity:0; animation:fadeUp .6s ease forwards 2.5s; }
  .bar-fill{ height:100%; width:0%; background:var(--phosphor); animation:fillBar 2.5s linear forwards 2.6s; }
  @keyframes fillBar{ to{ width:100%; } }

  .actions{ display:flex; gap:10px; justify-content:center; opacity:0; animation:fadeUp .6s ease forwards 2.6s; }
  .btn{ font-weight:600; font-size:14px; padding:10px 20px; border-radius:8px; text-decoration:none; border:1px solid transparent; transition:transform .15s ease; }
  .btn:hover{ transform:translateY(-1px); }
  .btn-solid{ background:var(--phosphor); color:var(--void); }
  .btn-ghost{ border-color:var(--line); color:var(--ink); }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>
<div class="grid-field" aria-hidden="true"></div>
<div class="wrap">
  <svg viewBox="0 0 150 130" aria-hidden="true">
    <circle class="glow" cx="75" cy="70" r="42" fill="none" stroke="var(--phosphor)" stroke-width="1.5" />
    <circle class="particle p1" cx="75" cy="58" r="2.4" />
    <circle class="particle p2" cx="75" cy="58" r="2" />
    <circle class="particle p3" cx="75" cy="58" r="2.2" />
    <circle class="particle p4" cx="75" cy="58" r="1.8" />
    <circle class="particle p5" cx="75" cy="58" r="2" />

    <path class="exit-arrow" d="M75,58 L94,39 M94,39 h-11 M94,39 v11" />

    <rect class="box" x="52" y="58" width="46" height="36" rx="7" />
    <path class="shackle" d="M60,58 v-13 a15,15 0 0 1 30,0 v13" />
    <rect class="keyhole" x="71.5" y="70" width="7" height="10" rx="2" />
  </svg>

  <h1>You're signed out.</h1>
  <p class="sub">Your session's been cleared. Your progress is exactly where you left it — log back in whenever you're ready.</p>
  <div class="readout" id="readout"></div>
  <div class="bar"><div class="bar-fill"></div></div>
  <div class="actions">
    <a class="btn btn-solid" href="/login.html">Log in again</a>
    <a class="btn btn-ghost" href="/">Go home</a>
  </div>
</div>

<script>
  (function(){
    var el = document.getElementById('readout');
    var lines = ['clearing session…', 'session cleared', 'redirecting to login…'];
    var i = 0;
    function show(){
      if(i >= lines.length) return;
      el.textContent = lines[i];
      i++;
      setTimeout(show, 800);
    }
    setTimeout(show, 1600);
  })();
  // Auto-redirect once the animation + readout have played out. A manual
  // click on either button before then just navigates immediately.
  setTimeout(function(){ location.href = '/login.html'; }, 5100);
</script>
</body>
</html>
